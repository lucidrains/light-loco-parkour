[project]
name = "light-loco-parkour"
version = "0.0.1"
description = "Implementation of Light Loco Parkour, Versatile Perceptive Whole-Body Locomotion via Multi-Skill Distillation, out of Light Origins Labs"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'robotics',
    'locomotion',
    'parkour',
    'distillation'
]

classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "einx>=0.3.0",
    "einops>=0.8.0",
    "torch>=2.5",
    "torch-einops-utils>=0.1.12",
    "x-mlps-pytorch>=0.5.0"
]

[project.urls]
Homepage = "https://pypi.org/project/light-loco-parkour/"
Repository = "https://github.com/lucidrains/light-loco-parkour"

[project.optional-dependencies]
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["light_loco_parkour"]

[tool.hatch.build.targets.sdist]
include = [
    "light_loco_parkour",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
